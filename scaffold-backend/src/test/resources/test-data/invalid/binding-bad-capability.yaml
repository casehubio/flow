dsl: "0.1"
version: "1.0.0"
name: Binding Bad Capability
namespace: test-invalid
spec:
  capabilities:
    - name: validCapability
      inputSchema: "{}"
      outputSchema: "{}"
  workers:
    - name: valid-worker
      capabilities:
        - validCapability
      do:
        - setResult:
            set:
              done: true
  bindings:
    - name: broken-binding
      capability: nonExistentCapability
      on:
        contextChange:
          filter: '.data != null'
